# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "674cfafee88445bdf407a8825fc4f174"
name = "Centurion"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
# Matches apiVersion in app/shopify.server.ts (ApiVersion.October26).
api_version = "2026-10"

  # All webhook subscriptions are left out until application_url points at a hosted app: relative URIs
  # resolve against application_url, and Shopify rejects the placeholder (a Shopify domain).
  # Once the app is hosted, restore these (the routes exist under app/routes/webhooks.*):
  #   topics = [ "app/uninstalled" ]                       uri = "/webhooks/app/uninstalled"
  #   topics = [ "app/scopes_update" ]                     uri = "/webhooks/app/scopes_update"
  #   compliance_topics = [ "customers/data_request" ]     uri = "/webhooks/customers/data_request"
  #   compliance_topics = [ "customers/redact" ]           uri = "/webhooks/customers/redact"
  #   compliance_topics = [ "shop/redact" ]                uri = "/webhooks/shop/redact"
  # The compliance webhooks are required before App Store distribution.

[access_scopes]
# read_orders: last 60 days of orders with their customer journey (AI Sales).
# read_products: product titles, prices, stock and the centurion.* claim metafields (Answer Check).
# Add read_all_orders (needs Shopify approval) for longer windows, and write_products for Weekly Fix.
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]
